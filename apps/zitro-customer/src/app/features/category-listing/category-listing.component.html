<div class="category-listing-page" data-testid="category-listing-page">

  <div class="page-header" data-testid="category-listing-header">
    <button class="back-btn" (click)="goBack()" data-testid="category-listing-back-btn">
      <span class="material-icons">arrow_back</span>
    </button>
    <h2 class="page-title" data-testid="category-listing-title">
      @if (categoryName()) {
        {{ categoryName() }}
      } @else {
        {{ 'categoryListing.title' | i18n }}
      }
    </h2>
  </div>

  @if (isLoading()) {
    <lib-loader data-testid="category-listing-loader" />
  }

  @if (hasError()) {
    <lib-error-state
      data-testid="category-listing-error"
      (retryClicked)="retry()"
    />
  }

  @if (!isLoading() && !hasError()) {
    @if (products().length === 0) {
      <lib-empty-state data-testid="category-listing-empty" />
    } @else {
      <lib-product-grid
        data-testid="category-listing-product-grid"
        [products]="products()"
        [quantities]="quantities()"
        (addToCart)="onAddToCart($event)"
        (viewDetails)="onViewDetails($event)"
        (increment)="onIncrement($event)"
        (decrement)="onDecrement($event)"
      />
    }
  }

  <lib-item-detail-sheet
    data-testid="category-listing-detail-sheet"
    [product]="selectedProduct()"
    [isOpen]="isDetailOpen()"
    [quantity]="selectedProductQuantity()"
    (closed)="onDetailClosed()"
    (addToCart)="onAddToCart($event)"
    (increment)="onIncrement($event)"
    (decrement)="onDecrement($event)"
  />

  <app-cart-summary />
</div>
