<div class="search-page" data-testid="search-page">
  <div class="search-header" data-testid="search-header">
    <button class="back-btn" (click)="goBack()" data-testid="search-back-btn">
      <span class="material-icons">arrow_back</span>
    </button>
    <lib-search-bar
      class="search-bar-expanded"
      data-testid="search-bar"
      [value]="searchQuery()"
      (searchChange)="onSearchChange($event)"
    />
  </div>

  <div class="search-hint" data-testid="search-hint">
    <span class="material-icons">search</span>
    <p>{{ 'search.placeholder' | i18n }}</p>
  </div>
</div>
