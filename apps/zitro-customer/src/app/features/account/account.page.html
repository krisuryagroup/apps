<div class="dh-main-content dh-edit-profile" data-testid="account-page">
  <div class="dh-profile-content">
    <div class="dh-profile-image-section">
      <div
        class="dh-profile-image-container"
        (click)="onProfileImageClick()"
        data-testid="account-profile-image-btn"
        style="position: relative; min-height: 120px;"
      >
        <app-loader [isLoading]="isImageLoading()" [size]="50" type="spinner" color="#ff6b35" />
        <img
          [cachedSrc]="profileImage() || '/assets/banners/banner1.png'"
          alt="Profile"
          class="dh-profile-image"
          [fallbackSrc]="'/assets/banners/banner1.png'"
          (load)="onImageLoad()"
          (error)="onImageError()"
          data-testid="account-profile-image"
        />
        <div class="dh-camera-overlay">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            />
            <circle cx="12" cy="13" r="4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
      <input
        type="file"
        #fileInput
        (change)="onFileSelected($event)"
        accept="image/*"
        style="display: none;"
        data-testid="account-file-input"
      />
    </div>

    <form #accountForm="ngForm" (ngSubmit)="onSave()" class="dh-profile-form" autocomplete="off">
      <div class="dh-form-field">
        <div class="dh-field-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <input
          id="name"
          name="name"
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          [placeholder]="'account.namePlaceholder' | i18n"
          required
          minlength="2"
          maxlength="32"
          class="dh-input-field"
          data-testid="account-name-input"
        />
      </div>

      <div class="dh-form-field">
        <div class="dh-field-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <input
          id="email"
          name="email"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          [placeholder]="'account.emailPlaceholder' | i18n"
          email
          class="dh-input-field"
          data-testid="account-email-input"
        />
      </div>

      <div class="dh-form-field readonly-field">
        <div class="dh-field-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M22 16.92V19.92C22.0011 20.1985 21.9441 20.4742 21.8325 20.7293C21.7209 20.9845 21.5573 21.2136 21.3521 21.4019C21.1468 21.5901 20.9046 21.7335 20.6407 21.8227C20.3769 21.9119 20.0974 21.9451 19.82 21.92C16.7428 21.5856 13.787 20.5341 11.19 18.85C8.77382 17.3147 6.72533 15.2662 5.18999 12.85C3.49997 10.2412 2.44824 7.27099 2.11999 4.18C2.095 3.90347 2.12787 3.62476 2.21649 3.36162C2.30512 3.09849 2.44756 2.85669 2.63476 2.65162C2.82196 2.44655 3.0498 2.28271 3.30379 2.17052C3.55777 2.05833 3.83233 2.00026 4.10999 2H7.10999C7.5953 1.99522 8.06579 2.16708 8.43376 2.48353C8.80173 2.79999 9.04207 3.23945 9.10999 3.72C9.23662 4.68007 9.47144 5.62273 9.80999 6.53C9.94454 6.88792 9.97366 7.27691 9.8939 7.65088C9.81415 8.02485 9.62886 8.36811 9.35999 8.64L8.08999 9.91C9.51355 12.4135 11.5865 14.4864 14.09 15.91L15.36 14.64C15.6319 14.3711 15.9751 14.1858 16.3491 14.1061C16.7231 14.0263 17.1121 14.0555 17.47 14.19C18.3773 14.5286 19.3199 14.7634 20.28 14.89C20.7658 14.9585 21.2094 15.2032 21.5265 15.5775C21.8437 15.9518 22.0122 16.4296 22 16.92Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <input
          id="phone"
          name="phone"
          type="tel"
          [ngModel]="phone()"
          readonly
          [placeholder]="'account.phonePlaceholder' | i18n"
          class="dh-input-field"
          data-testid="account-phone-input"
        />
      </div>

      @if (saveError()) {
        <div class="dh-save-error" data-testid="account-save-error">
          {{ saveError() | i18n }}
        </div>
      }

      <button
        class="dh-save-button"
        type="submit"
        [disabled]="!accountForm.form.valid || isLoading()"
        data-testid="account-save-btn"
      >
        @if (isLoading()) {
          {{ 'common.saving' | i18n }}
        } @else {
          {{ 'account.saveChanges' | i18n }}
        }
      </button>
    </form>
  </div>
</div>
