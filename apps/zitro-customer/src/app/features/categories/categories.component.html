<div class="categories-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="categories-loading">
    <div class="category-skeleton" *ngFor="let item of [1,2,3,4,5,6]">
      <div class="skeleton-image"></div>
      <div class="skeleton-text"></div>
    </div>
  </div>

  <!-- Categories Grid -->
  <div *ngIf="!isLoading" class="categories-grid">
    <div class="category-card" 
         *ngFor="let category of categories" 
         (click)="navigateToListing(category)">
      <div class="category-image-container" style="position: relative; min-height: 100px; display: flex; align-items: center; justify-content: center;">
        <app-loader 
          [isLoading]="imageLoading[category.id]" 
          [size]="50" 
          type="spinner" 
          color="#ff6b35">
        </app-loader>
        <img 
          [cachedSrc]="category.imageURL" 
          [alt]="category.name"
          [fallbackSrc]="'assets/foodCategories/default.png'"
          (load)="onImageLoad(category.id)"
          (error)="onImageError(category.id)" />
      </div>
      <div class="category-name">{{ category.name }}</div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && categories.length === 0" class="categories-empty">
    <div class="empty-icon">🍽️</div>
    <h3>No Categories Available</h3>
    <p>Categories will appear here when available.</p>
  </div>
</div>
