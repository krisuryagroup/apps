<div class="categories-page" data-testid="categories-page">

  @if (isLoading()) {
    <lib-loader data-testid="categories-loader" />
  }

  @if (hasError()) {
    <lib-error-state
      data-testid="categories-error"
      (retryClicked)="retry()"
    />
  }

  @if (!isLoading() && !hasError()) {
    @if (categories().length === 0) {
      <lib-empty-state data-testid="categories-empty" />
    } @else {
      <div class="categories-grid" data-testid="categories-grid">
        @for (category of categories(); track category.id) {
          <button
            class="category-card"
            [attr.data-testid]="'category-card-' + category.id"
            (click)="navigateToListing(category)"
          >
            <div class="category-image-wrapper">
              <img
                [cachedSrc]="category.imageUrl || 'assets/foodCategories/default.png'"
                [alt]="category.name"
                fallbackSrc="assets/foodCategories/default.png"
                class="category-image"
              />
            </div>
            <span class="category-name">{{ category.name }}</span>
          </button>
        }
      </div>
    }
  }
</div>
