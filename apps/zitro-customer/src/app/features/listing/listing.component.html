<div class="listing-page" data-testid="listing-page">

  @if (isLoading()) {
    <lib-loader data-testid="listing-loader" />
  }

  @if (hasError()) {
    <lib-error-state
      data-testid="listing-error"
      (retryClicked)="retry()"
    />
  }

  @if (!isLoading() && !hasError()) {
    <div class="listing-controls" data-testid="listing-controls">
      <lib-search-bar
        data-testid="listing-search"
        [value]="searchQuery()"
        (searchChange)="onSearchChange($event)"
      />

      @if (categoryBarItems().length > 0) {
        <lib-category-bar
          data-testid="listing-category-bar"
          [items]="categoryBarItems()"
          [activeId]="activeCategoryId()"
          (categorySelected)="onCategorySelect($event)"
        />
      }
    </div>

    @if (filteredProducts().length === 0) {
      <lib-empty-state data-testid="listing-empty" />
    } @else {
      <lib-product-grid
        data-testid="listing-product-grid"
        [products]="filteredProducts()"
        [quantities]="quantities()"
        (addToCart)="onAddToCart($event)"
        (viewDetails)="onViewDetails($event)"
        (increment)="onIncrement($event)"
        (decrement)="onDecrement($event)"
      />
    }
  }

  <lib-item-detail-sheet
    data-testid="listing-detail-sheet"
    [product]="selectedProduct()"
    [isOpen]="isDetailOpen()"
    [quantity]="selectedProductQuantity()"
    (closed)="onDetailClosed()"
    (addToCart)="onAddToCart($event)"
    (increment)="onIncrement($event)"
    (decrement)="onDecrement($event)"
  />

  <app-cart-summary />
</div>
