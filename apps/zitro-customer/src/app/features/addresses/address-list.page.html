<div class="address-list-page" data-testid="address-list-page">
  <header
    class="page-header"
    data-testid="page-header"
    style="display: flex; align-items: center; gap: 8px"
  >
    <button
      class="back-btn"
      type="button"
      aria-label="Back"
      (click)="goBack()"
      style="
        background: none;
        border: none;
        padding: 0;
        margin-right: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
      "
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M19 12H5M5 12L12 19M5 12L12 5"
          stroke="#222"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <h1 class="page-title" style="margin: 0">{{ 'address.title' | i18n }}</h1>
  </header>

  @if (isLoading()) {
  <lib-loader data-testid="address-loader" />
  } @else if (showForm()) {
  <!-- Inline edit form -->
  <div class="edit-form-container" data-testid="edit-form-container">
    <h2 class="form-heading">{{ 'address.editAddress' | i18n }}</h2>
    <lib-add-address-form
      [config]="{ mode: 'edit' }"
      [initialData]="editingAddress()"
      (submitted)="onFormSubmitted($event)"
      (cancelled)="onFormCancelled()"
      data-testid="edit-address-form"
    />
    @if (errorMessage()) {
    <p class="error-msg" data-testid="edit-error">
      {{ errorMessage() | i18n }}
    </p>
    }
  </div>
  } @else { @if (errorMessage()) {
  <p class="error-msg" data-testid="error-message">
    {{ errorMessage() | i18n }}
  </p>
  }

  <lib-address-list
    [addresses]="addresses()"
    (addressSelect)="onSelect($event)"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    data-testid="address-list"
  />

  <button
    class="add-new-btn"
    (click)="onAddNew()"
    data-testid="add-address-btn"
  >
    + {{ 'address.addNew' | i18n }}
  </button>
  }
</div>
