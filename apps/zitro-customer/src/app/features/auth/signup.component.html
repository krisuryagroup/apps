<div class="signup" data-testid="signup-page">
  <div class="signup__card">
    <div class="signup__avatar-wrap">
      @if (photoPreview()) {
        <img
          class="signup__avatar"
          [src]="photoPreview()"
          alt="Profile photo"
        />
      } @else {
        <div class="signup__avatar-placeholder" aria-hidden="true">
          <span class="signup__avatar-icon">&#128100;</span>
        </div>
      }
      <label
        class="signup__photo-btn"
        data-testid="photo-upload"
        aria-label="{{ 'signup.uploadPhoto' | i18n }}"
      >
        <span class="signup__photo-icon" aria-hidden="true">&#128247;</span>
        <input
          type="file"
          accept="image/*"
          class="signup__photo-input"
          (change)="onPhotoChange($event)"
        />
      </label>
    </div>

    <h1 class="signup__title">{{ 'signup.title' | i18n }}</h1>
    <p class="signup__subtitle">{{ 'signup.subtitle' | i18n }}</p>

    <div class="signup__field">
      <input
        class="signup__input"
        type="text"
        inputmode="text"
        autocomplete="name"
        data-testid="name-input"
        [attr.placeholder]="'signup.namePlaceholder' | i18n"
        [value]="name()"
        (input)="onNameInput($any($event.target).value)"
        (blur)="onNameBlur()"
        [attr.aria-invalid]="!!nameError()"
        aria-label="{{ 'signup.nameLabel' | i18n }}"
      />
      @if (nameError()) {
        <p class="signup__error" role="alert">{{ nameError() | i18n }}</p>
      }
    </div>

    @if (statusMessage()) {
      <p class="signup__status signup__status--error" role="alert">
        {{ statusMessage() | i18n }}
      </p>
    }

    <button
      class="signup__btn"
      type="button"
      data-testid="submit-btn"
      [disabled]="isSubmitDisabled"
      (click)="onSubmit()"
    >
      @if (isLoading()) {
        <span class="signup__spinner" aria-hidden="true"></span>
      }
      {{ 'signup.submitButton' | i18n }}
    </button>
  </div>
</div>
