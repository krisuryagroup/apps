<div class="auth-container">
  <div class="auth-card">
    <button class="auth-back" routerLink="/auth/signin"><span class="material-icons">arrow_back</span></button>
    <h2>Forgot Password</h2>
    <div class="auth-subtitle">Please enter your email address. You will receive a link to create a new password via email.</div>
    
    <div *ngIf="!isSubmitted">
      <form #forgotPasswordForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="auth-input-group">
          <span class="material-icons">mail</span>
          <input type="email" placeholder="Email Address" [(ngModel)]="email" name="email" (blur)="validateEmail()" (input)="validateEmail()" />
          <span class="material-icons auth-input-check" *ngIf="isEmailValid()">check</span>
          <span class="material-icons auth-input-error" *ngIf="isEmailInvalid()">close</span>
        </div>
        <div class="auth-error" *ngIf="emailError">{{ emailError }}</div>
        <button class="auth-btn primary" type="submit">Send</button>
      </form>
    </div>
    
    <div *ngIf="isSubmitted" class="auth-success">
      <span class="material-icons">check_circle</span>
      <p>{{ successMessage }}</p>
      <button class="auth-btn secondary" routerLink="/auth/signin">Back to Sign In</button>
    </div>
    
    <!-- Guest Access Section -->
    <div class="auth-guest-section">
      <div class="auth-divider">or</div>
      <button class="auth-btn secondary" type="button" (click)="continueAsGuest()">
        <span class="material-icons">person_outline</span>
        Continue as Guest
      </button>
      <p class="auth-guest-note">Browse and explore our menu without creating an account</p>
    </div>
  </div>
</div>
