<div class="dh-main-content dh-contact-us" data-testid="contact-us-page">
  <div class="dh-contact-card">
    <div class="dh-contact-title">{{ 'contactUs.title' | i18n }}</div>
    <div class="dh-contact-info">
      <div class="dh-contact-row">
        <span class="material-icons dh-contact-icon">email</span>
        <span class="dh-contact-label">{{ 'contactUs.email' | i18n }}:</span>
        <div class="dh-contact-value-container">
          <a [href]="emailHref()" class="dh-contact-value dh-email-link" data-testid="contact-email-link">{{ email() }}</a>
          <button
            class="dh-copy-btn"
            (click)="copyEmail()"
            [title]="emailCopied() ? ('contactUs.copied' | i18n) : ('contactUs.copyEmail' | i18n)"
            type="button"
            data-testid="contact-copy-email-btn"
          >
            <span class="material-icons">{{ emailCopied() ? 'check' : 'content_copy' }}</span>
          </button>
        </div>
      </div>
      <div class="dh-contact-row">
        <span class="material-icons dh-contact-icon">call</span>
        <span class="dh-contact-label">{{ 'contactUs.phone' | i18n }}:</span>
        <div class="dh-contact-value-container">
          <a [href]="phoneHref()" class="dh-contact-value dh-phone-link" data-testid="contact-phone-link">{{ phone() }}</a>
          <button
            class="dh-copy-btn"
            (click)="copyPhone()"
            [title]="phoneCopied() ? ('contactUs.copied' | i18n) : ('contactUs.copyPhone' | i18n)"
            type="button"
            data-testid="contact-copy-phone-btn"
          >
            <span class="material-icons">{{ phoneCopied() ? 'check' : 'content_copy' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
