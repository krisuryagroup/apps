<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pizza base -->
  <circle cx="100" cy="100" r="85" fill="#F4D03F" stroke="#E8B923" stroke-width="3"/>
  
  <!-- Pizza crust edge (3D effect) -->
  <path d="M 100 15 A 85 85 0 0 1 185 100 A 85 85 0 0 1 100 185 A 85 85 0 0 1 15 100 A 85 85 0 0 1 100 15 Z" 
        fill="none" stroke="#D4A520" stroke-width="8" opacity="0.6"/>
  
  <!-- Tomato sauce -->
  <circle cx="100" cy="100" r="75" fill="#E74C3C" opacity="0.8"/>
  
  <!-- Cheese texture -->
  <circle cx="100" cy="100" r="75" fill="#FFC857" opacity="0.7"/>
  
  <!-- Pepperoni slices -->
  <circle cx="70" cy="70" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  <circle cx="130" cy="75" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  <circle cx="100" cy="110" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  <circle cx="65" cy="130" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  <circle cx="135" cy="125" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  <circle cx="105" cy="65" r="15" fill="#C0392B" stroke="#A93226" stroke-width="2"/>
  
  <!-- Pepperoni highlights -->
  <circle cx="73" cy="67" r="3" fill="#E74C3C" opacity="0.6"/>
  <circle cx="133" cy="72" r="3" fill="#E74C3C" opacity="0.6"/>
  <circle cx="103" cy="107" r="3" fill="#E74C3C" opacity="0.6"/>
  <circle cx="68" cy="127" r="3" fill="#E74C3C" opacity="0.6"/>
  <circle cx="138" cy="122" r="3" fill="#E74C3C" opacity="0.6"/>
  <circle cx="108" cy="62" r="3" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Basil leaves -->
  <ellipse cx="90" cy="95" rx="8" ry="12" fill="#27AE60" opacity="0.9" transform="rotate(-20 90 95)"/>
  <ellipse cx="120" cy="105" rx="8" ry="12" fill="#27AE60" opacity="0.9" transform="rotate(30 120 105)"/>
  <ellipse cx="80" cy="115" rx="8" ry="12" fill="#27AE60" opacity="0.9" transform="rotate(10 80 115)"/>
  
  <!-- Cheese stretches/melted cheese effect -->
  <path d="M 100 100 Q 110 105 120 100" fill="none" stroke="#FFF8DC" stroke-width="2" opacity="0.7"/>
  <path d="M 80 90 Q 85 95 90 90" fill="none" stroke="#FFF8DC" stroke-width="2" opacity="0.7"/>
  <path d="M 110 120 Q 115 125 120 120" fill="none" stroke="#FFF8DC" stroke-width="2" opacity="0.7"/>
  
  <!-- Pizza slice cut lines (for effect) -->
  <line x1="100" y1="100" x2="100" y2="15" stroke="#D4A520" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="100" x2="185" y2="100" stroke="#D4A520" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="100" x2="40" y2="160" stroke="#D4A520" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="100" x2="160" y2="160" stroke="#D4A520" stroke-width="1" opacity="0.3"/>
</svg>
