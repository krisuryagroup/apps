<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">{{ appTitle() }}</h1>

    <form class="login-form" (ngSubmit)="submit()" novalidate>
      <lib-form-field labelKey="login.email" [error]="null">
        <input
          data-testid="email-input"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          class="form-input"
        />
      </lib-form-field>

      <lib-form-field labelKey="login.password" [error]="null">
        <input
          data-testid="password-input"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="form-input"
        />
      </lib-form-field>

      @if (errorKey()) {
        <p data-testid="error-message" class="error-message" role="alert">
          {{ errorKey()! | i18n }}
        </p>
      }

      <button
        data-testid="login-btn"
        type="submit"
        class="login-btn"
        [disabled]="loading() || !email || !password"
      >
        @if (loading()) {
          {{ 'login.signingIn' | i18n }}
        } @else {
          {{ 'login.signIn' | i18n }}
        }
      </button>
    </form>
  </div>
</div>
