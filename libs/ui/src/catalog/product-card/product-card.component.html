<div
  class="product-card"
  [attr.data-layout]="config().layout"
  (click)="onCardClick()"
  data-testid="product-card"
>
  <div class="product-card__image-wrap">
    <img
      [cachedSrc]="product().imageUrl || 'assets/foodCategories/default.png'"
      [fallbackSrc]="'assets/foodCategories/default.png'"
      [alt]="product().name"
      class="product-card__image"
    />
    @if (config().showDietaryBadge) {
      @if (isVeg()) {
        <span class="product-card__badge product-card__badge--veg" data-testid="veg-indicator">●</span>
      } @else {
        <span class="product-card__badge product-card__badge--nonveg" data-testid="nonveg-indicator">●</span>
      }
    }
  </div>

  <div class="product-card__body">
    <span class="product-card__name">{{ product().name }}</span>
    <span class="product-card__price" data-testid="product-card-price">₹{{ effectivePrice() }}</span>

    @if (!isAvailable()) {
      <span class="product-card__out-of-stock" data-testid="product-card-out-of-stock">
        {{ 'listing.outOfStock' | i18n }}
      </span>
    } @else if (config().showAddButton) {
      @if (quantity() > 0) {
        <div class="product-card__qty" data-testid="product-card-qty-controls">
          <button class="product-card__qty-btn" (click)="onDecrement($event)" data-testid="product-card-decrement-btn" type="button">−</button>
          <span class="product-card__qty-value" data-testid="product-card-qty">{{ quantity() }}</span>
          <button class="product-card__qty-btn" (click)="onIncrement($event)" data-testid="product-card-increment-btn" type="button">+</button>
        </div>
      } @else {
        <button class="product-card__add-btn" (click)="onAddClick($event)" data-testid="product-card-add-btn" type="button">
          {{ 'listing.addToCart' | i18n }}
        </button>
      }
    }
  </div>
</div>
