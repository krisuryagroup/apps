<div class="item-slider-container" *ngIf="displayProducts.length > 0">
  <!-- Section Title -->
  <div class="item-slider-header">
    <h3 class="item-slider-title">{{ title }}</h3>
    <button 
      *ngIf="shouldShowViewAll" 
      class="view-all-btn" 
      (click)="onViewAllClick()">
      View all <span class="material-icons">chevron_right</span>
    </button>
  </div>

  <!-- Navigation Arrows -->
  <button 
    *ngIf="displayProducts.length > 0"
    class="item-slider-nav-btn item-slider-nav-left" 
    (click)="scrollLeft()"
    [disabled]="isAtScrollStart">
    <span class="material-icons">chevron_left</span>
  </button>
  
  <button 
    *ngIf="displayProducts.length > 0"
    class="item-slider-nav-btn item-slider-nav-right" 
    (click)="scrollRight()"
    [disabled]="isAtScrollEnd">
    <span class="material-icons">chevron_right</span>
  </button>

  <!-- Items List -->
  <div class="item-slider-scroll-container" #scrollContainer>
    <div class="item-slider-list">
      <div 
        class="item-slider-card" 
        *ngFor="let product of displayProducts; trackBy: trackByProductId"
        (click)="onProductClick(product)">
      
      <!-- Product Image -->
      <div class="item-slider-image-container" style="position: relative; min-height: 150px; display: flex; align-items: center; justify-content: center;">
        <app-loader 
          [isLoading]="imageLoading[product.id]" 
          [size]="50" 
          type="spinner" 
          color="#ff6b35">
        </app-loader>
        <img 
          [cachedSrc]="product.imageUrl || 'assets/foodCategories/default.png'" 
          [alt]="product.name" 
          [fallbackSrc]="'assets/foodCategories/default.png'"
          class="item-slider-img"
          (load)="onImageLoad(product.id)"
          (error)="onImageError(product.id)" />
        
        <!-- Favorite Button -->
        <button 
          class="favorite-btn" 
          (click)="toggleFavorite(product, $event)"
          [class.active]="isFavorite(product)">
          <span class="material-icons">{{ isFavorite(product) ? 'favorite' : 'favorite_border' }}</span>
        </button>
      </div>
      
      <!-- Product Info -->
      <div class="item-slider-info">
        <div class="item-slider-name">{{ product.name }}</div>
        <div class="item-slider-category">{{ product.categoryName | titlecase }}</div>
        <div class="item-slider-meta">
          <span class="item-slider-price">{{ formatPrice(product.price) }}</span>
        </div>
      </div>
      
      <!-- Add to Cart Button/Quantity Controls -->
      <div class="item-slider-actions">
        <div class="quantity-controls" *ngIf="getItemQuantity(product) > 0">
          <button 
            class="qty-btn decrement" 
            (click)="decrementQuantity(product); $event.stopPropagation()">
            <span class="material-icons">remove</span>
          </button>
          <span class="qty-value">{{ getItemQuantity(product) }}</span>
          <button 
            class="qty-btn increment" 
            (click)="incrementQuantity(product); $event.stopPropagation()">
            <span class="material-icons">add</span>
          </button>
        </div>
        
        <button 
          *ngIf="getItemQuantity(product) === 0" 
          class="add-btn" 
          (click)="incrementQuantity(product); $event.stopPropagation()">
          Add
        </button>
      </div>
    </div>
    
    <!-- View All Card -->
    <div 
      *ngIf="shouldShowViewAll"
      class="item-slider-card">
      <app-view-all-card
        size="medium"
        variant="rounded"
        label="View All"
        [showLabel]="true"
        (clicked)="onViewAllClick()">
      </app-view-all-card>
    </div>
    </div>
  </div>
</div>
