<div class="update-overlay" [class.mandatory]="isMandatory">
  <div class="update-dialog">
    <div class="update-icon">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" 
              fill="currentColor"/>
      </svg>
    </div>
    
    <h2 class="update-title">{{ isMandatory ? 'Update Required' : 'Update Available' }}</h2>
    
    <p class="update-message">{{ message }}</p>
    
    <div class="update-actions">
      <button class="btn-update" (click)="onUpdate()">
        {{ updateButtonText }}
      </button>
      
      <button *ngIf="!isMandatory" class="btn-later" (click)="onLater()">
        {{ laterButtonText }}
      </button>
    </div>
    
    <div *ngIf="isMandatory" class="mandatory-notice">
      <small>You must update to continue using the app</small>
    </div>
  </div>
</div>
