<div 
  class="product-card" 
  [class.horizontal]="displayStyle === 'horizontal'"
  [class.vertical]="displayStyle === 'vertical'"
  [class.compact]="compactMode"
  (click)="onProductClick()"
>
  <!-- Product Image -->
  <div class="product-image" style="position: relative; min-height: 150px; display: flex; align-items: center; justify-content: center;">
    <app-loader 
      [isLoading]="isImageLoading" 
      [size]="50" 
      type="spinner" 
      color="#ff6b35">
    </app-loader>
    <img 
      [cachedSrc]="product.imageUrl || 'assets/foodCategories/default.png'" 
      [alt]="product.name"
      [fallbackSrc]="'assets/foodCategories/default.png'"
      (load)="onImageLoad()"
      (error)="onImageError()"
    >
    
    <!-- Favorite Button -->
    <button 
      *ngIf="showFavorite" 
      class="favorite-btn" 
      [class.active]="isFavorite"
      (click)="onFavoriteToggle($event)"
      type="button"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
  </div>

  <!-- Product Details -->
  <div class="product-details">
    <h3 class="product-title">{{ product.name }}</h3>
    
    <div *ngIf="showDescription && product.description && !compactMode" class="product-description">
      <app-truncated-text 
        [text]="product.description" 
        [maxLength]="100"
        [showInDialog]="true"
        (showDialogEvent)="onShowDescriptionDialog($event)">
      </app-truncated-text>
    </div>
    
    <div class="product-meta" *ngIf="!compactMode">
      <span class="product-weight" *ngIf="product.weight">{{ product.weight }}</span>
      <span class="product-stock" *ngIf="product.stock !== undefined">Stock: {{ product.stock }}</span>
    </div>
    
    <div class="product-footer">
      <div class="product-price">{{ formatPrice(product.price) }}</div>
      
      <!-- Quantity Controls -->
      <div *ngIf="showQuantityControls" class="quantity-controls">
        <div class="qty-controls" *ngIf="currentQuantity > 0">
          <button class="qty-btn decrement" (click)="onDecrement($event)" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 13H5v-2h14v2z"/>
            </svg>
          </button>
          <span class="qty-value">{{ currentQuantity }}</span>
          <button class="qty-btn increment" (click)="onIncrement($event)" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
          </button>
        </div>
        <button 
          *ngIf="currentQuantity === 0" 
          class="add-to-cart-btn" 
          (click)="onIncrement($event)"
          type="button"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Description Dialog -->
<app-description-dialog
  [isOpen]="showDescriptionDialog"
  [productName]="dialogProductName"
  [description]="dialogDescription"
  (closeEvent)="onCloseDescriptionDialog()">
</app-description-dialog>
