@if (isVisible()) {
  <div class="cart-summary-container">
    <button class="cart-summary" type="button" (click)="onCartClick()">
      <div class="cart-summary__left">
        <span class="material-icons cart-summary__icon">shopping_cart</span>
        <div class="cart-summary__info">
          <span class="cart-summary__count">{{ totalQuantity() }} item{{ totalQuantity() !== 1 ? 's' : '' }}</span>
          <span class="cart-summary__name">{{ businessName() }}</span>
        </div>
      </div>
      <div class="cart-summary__right">
        <span class="cart-summary__total">₹{{ totalAmount() | number:'1.0-0' }}</span>
        <span class="cart-summary__view-label">{{ 'cart.viewCart' | i18n }}</span>
        <span class="material-icons cart-summary__chevron">arrow_forward_ios</span>
      </div>
    </button>
  </div>
}
